name = "nps-report"
preview_urls = false
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Public, non-secret config. The NPS Data API key (used only by the offline
# harvester, scripts/harvest-parks.ts) is a secret — set it with:
#   wrangler secret put NPS_API_KEY
[vars]
SERVICE_NAME = "nps-report"
# Default sender identity stamped on reports when the caller omits one.
DEFAULT_FROM_NAME = ""
DEFAULT_FROM_EMAIL = ""

# Workers AI — powers /api/analyze (photo -> category + draft) and text rewrite.
[ai]
binding = "AI"

[observability]
enabled = true

[cache]
enabled = true

# Weekly consumer-path sweep of the park registry. `_meta.verified` in
# parks.data.json is a HARVEST date, not a health claim — it decays silently
# from the moment it is written. This cron re-asks the consumer's question
# ("does this token still open a usable form?") across all 435 parks and stores
# the answer, so registry health is continuously known rather than asserted.
# Mondays 09:17 UTC — off the hour, so we aren't in the top-of-hour crowd
# hitting nps.gov.
[triggers]
crons = ["17 9 * * 1"]

# Last sweep result, so /api/registry/health answers instantly instead of
# re-firing 435 requests at nps.gov per pageview.
[[kv_namespaces]]
binding = "REGISTRY_HEALTH"
id = "d108754c2da44d74a9461ae87fd2a067"
